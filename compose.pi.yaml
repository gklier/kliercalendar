# Only for the older "server and TV on one Pi" setup (pi/install.sh with DASHBOARD_RUNTIME=docker).
# The installer copies this to /opt/family-dashboard/compose.yaml. Host networking: the TV launcher
# reaches the server on localhost, and the settings page sees real client addresses.
services:
  dashboard:
    build: .
    image: family-dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    mem_limit: 512m
